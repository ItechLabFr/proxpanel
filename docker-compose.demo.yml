services:
  proxpanel-demo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PROXPANEL_DEMO_VERSION:-demo}
    image: proxpanel-demo:local
    container_name: proxpanel-demo
    restart: unless-stopped
    ports:
      - "${PROXPANEL_DEMO_PORT:-8082}:8080"
    environment:
      PORT: 8080
      PROXPANEL_RUNTIME_DIR: /opt/proxpanel-runtime
      PROXPANEL_DATA_DIR: /app/data
      PROXPANEL_DEMO_MODE: "true"
      PROXPANEL_DEMO_USER: "demo"
      PROXPANEL_DEMO_PASSWORD: "ProxPanelDemo2026!"
      PROXPANEL_DEMO_EMAIL: "demo@proxpanel.fr"
    volumes:
      - proxpanel_demo_data:/app/data
    tmpfs:
      - /opt/proxpanel-runtime

volumes:
  proxpanel_demo_data:
