services:
  proxpanel-demo:
    image: itechlab/proxpanel:demo
    container_name: proxpanel-demo
    restart: unless-stopped
    ports:
      - "${PROXPANEL_DEMO_PORT:-8080}:8080"
    environment:
      PORT: 8080
      PROXPANEL_RUNTIME_DIR: /opt/proxpanel-runtime
      PROXPANEL_DATA_DIR: /app/data
    volumes:
      - proxpanel_demo_data:/app/data
      - proxpanel_demo_runtime:/opt/proxpanel-runtime
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower-demo:
    image: containrrr/watchtower:latest
    container_name: proxpanel-demo-updater
    restart: unless-stopped
    command: --interval 60 --cleanup --label-enable proxpanel-demo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  proxpanel_demo_data:
  proxpanel_demo_runtime:
