name: Bootstrap beta.15 release

on:
  push:
    paths:
      - '.github/workflows/bootstrap-beta15-release.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate beta.15
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./release.json').version")" = "1.7.0-beta.15"
          test "$(node -p "require('./app/package.json').version")" = "1.7.0-beta.15"
          node --check launcher.js
          node --check app/server.js
          node --check app/public/app.js
          node --check app/public/auth-v15.js
          node --check app/public/sw.js
          docker build --pull --build-arg VERSION=1.7.0-beta.15 -t proxpanel-beta15-release-test .

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.0-beta.15"
          mkdir -p dist
          git archive --format=zip --prefix="proxpanel-v${version}/" --output="dist/proxpanel-v${version}.zip" HEAD
          chmod +x tools-build-update.sh
          ./tools-build-update.sh ./app ./dist
          cp release.json dist/release.json
          (
            cd dist
            sha256sum "proxpanel-v${version}.zip" "proxpanel-update-v${version}.zip" release.json > SHA256SUMS.txt
          )

      - name: Create GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.0-beta.15"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "ProxPanel ${version}" --notes-file "docs/releases/${version}.md"
            gh release upload "$tag" "dist/proxpanel-v${version}.zip" "dist/proxpanel-update-v${version}.zip" dist/release.json dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag"               --target "$GITHUB_SHA"               --title "ProxPanel ${version}"               --notes-file "docs/releases/${version}.md"               --prerelease               "dist/proxpanel-v${version}.zip"               "dist/proxpanel-update-v${version}.zip"               dist/release.json               dist/SHA256SUMS.txt
          fi

      - name: Setup QEMU
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish Docker Hub beta.15
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: |
          docker buildx build             --pull             --platform linux/amd64,linux/arm64             --build-arg VERSION=1.7.0-beta.15             -t itechlab/proxpanel:1.7.0-beta.15             -t itechlab/proxpanel:beta             --provenance=true             --sbom=true             --push .
