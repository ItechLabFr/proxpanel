name: Release ProxPanel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.7.2-beta.5'
        required: true
        type: string
      publish_docker:
        description: 'Also publish the version and channel tags to Docker Hub'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'release.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif printf '%s' "$GITHUB_REF" | grep -q '^refs/tags/'; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./release.json').version")"
          fi

          release_version="$(node -p "require('./release.json').version")"
          package_version="$(node -p "require('./app/package.json').version")"

          test "$version" = "$release_version" || {
            echo "release.json version mismatch: $release_version" >&2
            exit 1
          }
          test "$version" = "$package_version" || {
            echo "app/package.json version mismatch: $package_version" >&2
            exit 1
          }

          if [ "$version" != "1.7.0-beta.16" ]; then
            VERSION="$version" node - <<'NODE'
          const version = process.env.VERSION || '';
          const match = version.match(/-beta\.(\d+)(?:\.(\d+))?$/);
          if (version.includes('-beta.') && !match) {
            throw new Error('Invalid beta version format.');
          }
          if (match) {
            const betaNo = Number(match[1]);
            const patchNo = match[2] == null ? null : Number(match[2]);
            if (!Number.isInteger(betaNo) || betaNo < 1 || betaNo > 10) {
              throw new Error('ProxPanel permits beta.1 through beta.10 per version series.');
            }
            if (patchNo != null && (!Number.isInteger(patchNo) || patchNo < 1 || patchNo > 99)) {
              throw new Error('Beta patch prereleases must use .1 through .99.');
            }
          }
          NODE
          fi

          if printf '%s' "$version" | grep -q -- '-'; then
            prerelease=true
            channel=beta
          else
            prerelease=false
            channel=stable
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Validate source
        run: |
          node --check launcher.js
          node --check app/server.js
          node --check app/lib/reliability.js
          node --check app/lib/docker-history.js
          node --check app/lib/docker-images.js
          node --check app/lib/auth-security.js
          node --check app/lib/wazuh.js
          node --check app/lib/wazuh-client.js
          node --check app/lib/wazuh-alerts.js
          node --check app/lib/pbs-client.js
          node --check app/lib/automation-v2.js
          node --check app/public/wazuh-ui.js
          node --check app/public/pbs-ui.js
          node --check app/public/app.js
          if [ -f app/public/auth-v15.js ]; then node --check app/public/auth-v15.js; fi
          node --check app/public/sw.js
          test -f "docs/releases/${{ steps.version.outputs.version }}.md"

      - name: Validate Docker build
        run: |
          docker build --pull \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t "proxpanel-release-test:${{ steps.version.outputs.version }}" .

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist

          git archive \
            --format=zip \
            --prefix="proxpanel-v${version}/" \
            --output="dist/proxpanel-v${version}.zip" \
            HEAD

          chmod +x tools-build-update.sh
          ./tools-build-update.sh ./app ./dist
          cp release.json dist/release.json

          (
            cd dist
            sha256sum \
              "proxpanel-v${version}.zip" \
              "proxpanel-update-v${version}.zip" \
              release.json > SHA256SUMS.txt
          )

      - name: Prepare bilingual notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cp "docs/releases/${version}.md" dist/RELEASE_NOTES.md
          printf '\n## Téléchargements / Downloads\n\n' >> dist/RELEASE_NOTES.md
          printf -- '- \`proxpanel-v%s.zip\` — package complet / full package\n' "$version" >> dist/RELEASE_NOTES.md
          printf -- '- \`proxpanel-update-v%s.zip\` — mise à jour OTA / OTA update\n' "$version" >> dist/RELEASE_NOTES.md
          printf -- '- \`release.json\` — métadonnées / metadata\n' >> dist/RELEASE_NOTES.md
          printf -- '- \`SHA256SUMS.txt\` — sommes SHA-256 / SHA-256 checksums\n\n' >> dist/RELEASE_NOTES.md
          printf '**FR :** Docker Hub distribue les images conteneur. Le rollout et les révocations OTA restent gérés par \`updates.proxpanel.fr\`.\n\n' >> dist/RELEASE_NOTES.md
          printf '**EN:** Docker Hub distributes container images. OTA rollout and revocation remain managed by \`updates.proxpanel.fr\`.\n' >> dist/RELEASE_NOTES.md

      - name: Upload full package artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxpanel-v${{ steps.version.outputs.version }}
          path: dist/proxpanel-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload OTA package artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxpanel-update-v${{ steps.version.outputs.version }}
          path: dist/proxpanel-update-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "ProxPanel $version" \
              --notes-file dist/RELEASE_NOTES.md
            gh release upload "$tag" \
              "dist/proxpanel-v${version}.zip" \
              "dist/proxpanel-update-v${version}.zip" \
              dist/release.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            args=(release create "$tag"
              --target "$GITHUB_SHA"
              --title "ProxPanel $version"
              --notes-file dist/RELEASE_NOTES.md)

            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              args+=(--prerelease)
            fi

            gh "${args[@]}" \
              "dist/proxpanel-v${version}.zip" \
              "dist/proxpanel-update-v${version}.zip" \
              dist/release.json \
              dist/SHA256SUMS.txt
          fi

      - name: Revoke all previous GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ steps.version.outputs.tag }}"
          warning='⚠️ Cette version a été révoquée. Ne pas installer. Utilisez la version suivante.'

          gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' |
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            [ "$old_tag" != "$current_tag" ] || continue

            old_version="${old_tag#v}"
            body="$(gh release view "$old_tag" --json body --jq '.body // ""')"

            if [ "$(printf '%s\n' "$body" | head -n 1)" != "$warning" ]; then
              {
                printf '%s\n\n' "$warning"
                printf '%s\n' "$body"
              } > /tmp/revoked-notes.md
            else
              printf '%s\n' "$body" > /tmp/revoked-notes.md
            fi

            gh release edit "$old_tag" \
              --title "$old_version — REVOKED" \
              --notes-file /tmp/revoked-notes.md

            gh release view "$old_tag" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$old_tag" "$asset" -y || \
                echo "::warning::Could not delete asset $asset from $old_tag"
            done
          done

      - name: Setup QEMU
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker Hub image
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          channel="${{ steps.version.outputs.channel }}"

          tags=(
            "-t" "itechlab/proxpanel:${version}"
            "-t" "itechlab/proxpanel:${channel}"
          )
          if [ "$channel" = "stable" ]; then
            tags+=("-t" "itechlab/proxpanel:latest")
          fi

          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            "${tags[@]}" \
            --provenance=true \
            --sbom=true \
            --push .
