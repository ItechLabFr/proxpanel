name: Export beta.15 assets for ChatGPT

on:
  push:
    paths:
      - '.github/workflows/export-beta15-assets.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download GitHub Release assets
        shell: bash
        run: |
          mkdir -p export
          gh release download v1.7.0-beta.15             --repo ItechLabFr/proxpanel             --dir export             --pattern 'proxpanel-v1.7.0-beta.15.zip'             --pattern 'proxpanel-update-v1.7.0-beta.15.zip'             --pattern 'release.json'             --pattern 'SHA256SUMS.txt'
      - name: Upload chat bundle
        uses: actions/upload-artifact@v4
        with:
          name: proxpanel-1.7.0-beta.15-release-bundle
          path: export/*
          if-no-files-found: error
          retention-days: 1
