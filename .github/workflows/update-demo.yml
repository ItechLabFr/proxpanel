name: Update Demo

run-name: "Update demo from ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag or commit to deploy to the demo"
        required: true
        default: "main"
        type: string
      no_cache:
        description: "Force a complete Docker rebuild without cache"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: proxpanel-demo
  cancel-in-progress: false

jobs:
  build-demo:
    name: Validate and publish demo image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve demo metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./release.json').version")"
          package_version="$(node -p "require('./app/package.json').version")"

          test "$version" = "$package_version" || {
            echo "release.json version mismatch: $version != $package_version" >&2
            exit 1
          }

          short_sha="$(git rev-parse --short=12 HEAD)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check launcher.js
          node --check app/server.js
          node --check app/public/app.js
          if [ -f app/public/auth-v15.js ]; then node --check app/public/auth-v15.js; fi
          node --check app/public/sw.js

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ inputs.no_cache }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            itechlab/proxpanel:demo
            itechlab/proxpanel:demo-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/ItechLabFr/proxpanel
          cache-from: type=gha,scope=proxpanel-demo
          cache-to: type=gha,mode=max,scope=proxpanel-demo

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## ProxPanel demo image published"
            echo
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Commit: \`${{ steps.meta.outputs.short_sha }}\`"
            echo "- Moving tag: \`itechlab/proxpanel:demo\`"
            echo "- Immutable tag: \`itechlab/proxpanel:demo-${{ steps.meta.outputs.short_sha }}\`"
            echo
            echo "No GitHub Release, OTA publication, beta/stable Docker tag or revocation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
