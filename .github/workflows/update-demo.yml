name: Update Demo

run-name: "Update demo from ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag or commit to deploy to the demo"
        required: true
        default: "main"
        type: string
      no_cache:
        description: "Force a complete Docker rebuild without cache"
        required: true
        default: false
        type: boolean
      deploy_server:
        description: "Deploy the new demo image to the configured demo server"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: proxpanel-demo
  cancel-in-progress: false

jobs:
  build-demo:
    name: Validate, publish and deploy demo
    runs-on: ubuntu-latest
    env:
      DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
      DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
      DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
      DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
      DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT }}
      DEMO_DEPLOY_PATH: ${{ secrets.DEMO_DEPLOY_PATH }}

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve demo metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./release.json').version")"
          package_version="$(node -p "require('./app/package.json').version")"

          test "$version" = "$package_version" || {
            echo "release.json version mismatch: $version != $package_version" >&2
            exit 1
          }

          short_sha="$(git rev-parse --short=12 HEAD)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check launcher.js
          node --check app/server.js
          node --check app/public/app.js
          if [ -f app/public/auth-v15.js ]; then node --check app/public/auth-v15.js; fi
          node --check app/public/sw.js

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ inputs.no_cache }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            itechlab/proxpanel:demo
            itechlab/proxpanel:demo-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/ItechLabFr/proxpanel
          cache-from: type=gha,scope=proxpanel-demo
          cache-to: type=gha,mode=max,scope=proxpanel-demo

      - name: Check demo server configuration
        id: deploy_config
        if: ${{ inputs.deploy_server }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$DEMO_SSH_HOST" ] \
            && [ -n "$DEMO_SSH_USER" ] \
            && [ -n "$DEMO_SSH_PRIVATE_KEY" ] \
            && [ -n "$DEMO_SSH_KNOWN_HOSTS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Demo image was published, but SSH deployment was skipped because one or more DEMO_SSH_* secrets are missing."
          fi

      - name: Configure SSH
        if: ${{ inputs.deploy_server && steps.deploy_config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEMO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEMO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy demo server
        id: deploy
        if: ${{ inputs.deploy_server && steps.deploy_config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          port="${DEMO_SSH_PORT:-22}"
          deploy_path="${DEMO_DEPLOY_PATH:-/opt/proxpanel-demo}"
          printf -v quoted_path '%q' "$deploy_path"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$port" \
            -o BatchMode=yes \
            "$DEMO_SSH_USER@$DEMO_SSH_HOST" \
            "PROXPANEL_DEMO_DIR=$quoted_path bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$PROXPANEL_DEMO_DIR"

          docker compose -f docker-compose.demo.yml pull proxpanel-demo
          docker compose -f docker-compose.demo.yml up -d --remove-orphans proxpanel-demo

          for attempt in $(seq 1 15); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' proxpanel-demo 2>/dev/null || true)"
            case "$status" in
              healthy|running)
                echo "ProxPanel demo is $status."
                exit 0
                ;;
              unhealthy|exited|dead)
                echo "ProxPanel demo entered state: $status" >&2
                docker logs --tail 100 proxpanel-demo || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the ProxPanel demo container." >&2
          docker logs --tail 100 proxpanel-demo || true
          exit 1
          REMOTE

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ProxPanel demo"
            echo
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Commit: \`${{ steps.meta.outputs.short_sha }}\`"
            echo "- Moving tag: \`itechlab/proxpanel:demo\`"
            echo "- Immutable tag: \`itechlab/proxpanel:demo-${{ steps.meta.outputs.short_sha }}\`"
            echo
            if [ "${{ inputs.deploy_server }}" != "true" ]; then
              echo "- Server deployment: not requested"
            elif [ "${{ steps.deploy_config.outputs.enabled }}" != "true" ]; then
              echo "- Server deployment: skipped (SSH secrets not configured)"
            elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
              echo "- Server deployment: success"
            else
              echo "- Server deployment: failed"
            fi
            echo
            echo "No GitHub Release, OTA publication, beta/stable/latest Docker tag or release revocation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
