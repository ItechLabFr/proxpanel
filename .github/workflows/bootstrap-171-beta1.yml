name: Bootstrap 1.7.1-beta.1 release

on:
  push:
    paths:
      - '.github/workflows/bootstrap-171-beta1.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./release.json').version")" = "1.7.1-beta.1"
          test "$(node -p "require('./app/package.json').version")" = "1.7.1-beta.1"
          node --check launcher.js
          node --check app/server.js
          node --check app/public/app.js
          node --check app/public/auth-v15.js
          node --check app/public/sw.js
          docker build --pull --build-arg VERSION=1.7.1-beta.1 -t proxpanel-171-beta1-test .

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="proxpanel-v1.7.1-beta.1/" --output="dist/proxpanel-v1.7.1-beta.1.zip" HEAD
          chmod +x tools-build-update.sh
          ./tools-build-update.sh ./app ./dist
          cp release.json dist/release.json
          (
            cd dist
            sha256sum "proxpanel-v1.7.1-beta.1.zip" "proxpanel-update-v1.7.1-beta.1.zip" release.json > SHA256SUMS.txt
          )

      - name: Prepare bilingual notes
        shell: bash
        run: |
          cp docs/releases/1.7.1-beta.1.md /tmp/notes.md
          cat >> /tmp/notes.md <<'EOF'

          ## Téléchargements / Downloads

          - \`proxpanel-v1.7.1-beta.1.zip\` — package complet / full package
          - \`proxpanel-update-v1.7.1-beta.1.zip\` — mise à jour OTA / OTA update
          - \`release.json\` — métadonnées / metadata
          - \`SHA256SUMS.txt\` — sommes SHA-256 / SHA-256 checksums

          **FR :** Docker Hub reste le canal de distribution des images conteneur. Le rollout et les révocations OTA restent gérés par \`updates.proxpanel.fr\`.

          **EN:** Docker Hub remains the container image distribution channel. OTA rollout and revocation remain managed by \`updates.proxpanel.fr\`.
          EOF

      - name: Create GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.7.1-beta.1 >/dev/null 2>&1; then
            gh release edit v1.7.1-beta.1 --title "ProxPanel 1.7.1-beta.1" --notes-file /tmp/notes.md
            gh release upload v1.7.1-beta.1 \
              dist/proxpanel-v1.7.1-beta.1.zip \
              dist/proxpanel-update-v1.7.1-beta.1.zip \
              dist/release.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.7.1-beta.1 \
              --target "$GITHUB_SHA" \
              --title "ProxPanel 1.7.1-beta.1" \
              --notes-file /tmp/notes.md \
              --prerelease \
              dist/proxpanel-v1.7.1-beta.1.zip \
              dist/proxpanel-update-v1.7.1-beta.1.zip \
              dist/release.json \
              dist/SHA256SUMS.txt
          fi

      - name: Upload release bundle for handoff
        uses: actions/upload-artifact@v4
        with:
          name: proxpanel-1.7.1-beta.1-release-bundle
          path: |
            dist/proxpanel-v1.7.1-beta.1.zip
            dist/proxpanel-update-v1.7.1-beta.1.zip
            dist/release.json
            dist/SHA256SUMS.txt
          retention-days: 1

      - name: Setup QEMU
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish Docker Hub image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=1.7.1-beta.1 \
            -t itechlab/proxpanel:1.7.1-beta.1 \
            -t itechlab/proxpanel:beta \
            --provenance=true \
            --sbom=true \
            --push .
