name: Bootstrap beta.16 release

on:
  push:
    paths:
      - '.github/workflows/bootstrap-beta16-release.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate beta.16
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./release.json').version")" = "1.7.0-beta.16"
          test "$(node -p "require('./app/package.json').version")" = "1.7.0-beta.16"
          node --check launcher.js
          node --check app/server.js
          node --check app/public/app.js
          if [ -f app/public/auth-v15.js ]; then node --check app/public/auth-v15.js; fi
          node --check app/public/sw.js
          docker build --pull --build-arg VERSION=1.7.0-beta.16 -t proxpanel-beta16-release-test .

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="proxpanel-v1.7.0-beta.16/" --output="dist/proxpanel-v1.7.0-beta.16.zip" HEAD
          chmod +x tools-build-update.sh
          ./tools-build-update.sh ./app ./dist
          cp release.json dist/release.json
          (
            cd dist
            sha256sum "proxpanel-v1.7.0-beta.16.zip" "proxpanel-update-v1.7.0-beta.16.zip" release.json > SHA256SUMS.txt
          )

      - name: Prepare bilingual release notes
        shell: bash
        run: |
          cp docs/releases/1.7.0-beta.16.md /tmp/notes.md
          printf '\n## Téléchargements / Downloads\n\n' >> /tmp/notes.md
          printf -- '- \`proxpanel-v1.7.0-beta.16.zip\` — package complet / full package\n' >> /tmp/notes.md
          printf -- '- \`proxpanel-update-v1.7.0-beta.16.zip\` — mise à jour OTA / OTA update\n' >> /tmp/notes.md
          printf -- '- \`release.json\` — métadonnées / metadata\n' >> /tmp/notes.md
          printf -- '- \`SHA256SUMS.txt\` — sommes SHA-256 / SHA-256 checksums\n' >> /tmp/notes.md

      - name: Create GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.7.0-beta.16 >/dev/null 2>&1; then
            gh release edit v1.7.0-beta.16 --title "ProxPanel 1.7.0-beta.16" --notes-file /tmp/notes.md
            gh release upload v1.7.0-beta.16 \
              dist/proxpanel-v1.7.0-beta.16.zip \
              dist/proxpanel-update-v1.7.0-beta.16.zip \
              dist/release.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.7.0-beta.16 \
              --target "$GITHUB_SHA" \
              --title "ProxPanel 1.7.0-beta.16" \
              --notes-file /tmp/notes.md \
              --prerelease \
              dist/proxpanel-v1.7.0-beta.16.zip \
              dist/proxpanel-update-v1.7.0-beta.16.zip \
              dist/release.json \
              dist/SHA256SUMS.txt
          fi

      - name: Upload release bundle for handoff
        uses: actions/upload-artifact@v4
        with:
          name: proxpanel-1.7.0-beta.16-release-bundle
          path: |
            dist/proxpanel-v1.7.0-beta.16.zip
            dist/proxpanel-update-v1.7.0-beta.16.zip
            dist/release.json
            dist/SHA256SUMS.txt
          retention-days: 1

      - name: Setup QEMU
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish Docker Hub beta.16
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=1.7.0-beta.16 \
            -t itechlab/proxpanel:1.7.0-beta.16 \
            -t itechlab/proxpanel:beta \
            --provenance=true \
            --sbom=true \
            --push .
